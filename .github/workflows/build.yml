name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact.outputs.file }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Configure public deployment metadata
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          CSP_API: ${{ secrets.CSP_API }}
          CSP_STATIC: ${{ secrets.CSP_STATIC }}
        run: node scripts/configure-dist.mjs

      - name: Audit dependencies
        run: bun audit

      - name: Validate dist
        run: bun run validate:dist

      - name: Scan source and distribution for credential material
        run: bun run verify:security

      - name: Resolve artifact name
        id: artifact
        shell: bash
        run: echo "file=CFSM-Glassmorphism-build-${GITHUB_SHA::7}.zip" >> "$GITHUB_OUTPUT"

      - name: Package theme
        working-directory: dist
        run: zip -r "../${{ steps.artifact.outputs.file }}" index.html assets

      - name: Upload theme archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.file }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  # main 保留源码；只有通过质量门的构建才进入可安装的滚动预览分支。
  # 不打标签、不创建 Release，也不改稳定版 theme-dist。
  preview-main:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-dist
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download verified theme archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: archive

      - name: Publish append-only dist branch
        run: node scripts/publish-preview.mjs "archive/${{ needs.verify.outputs.artifact-name }}" "$GITHUB_SHA"

  # CFSM 主题商店支持「自定义主题 URL」，它把
  # https://github.com/<owner>/<repo>/tree/<ref> 解析为
  # https://raw.githubusercontent.com/<owner>/<repo>/<ref>/ 并直接拉取
  # index.html 与 assets/。因此构建产物必须存在于某个 git ref 中。
  # 这里只把已通过全部质量门的产物发布到专用的 theme-dist 分支，
  # 并打一个不可变的 theme-v<version> 标签供用户固定版本；
  # main 的源码历史依旧不包含 dist。
  theme-branch:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download verified theme archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: archive

      - name: Publish theme-store branch and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          theme_tag="theme-${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "$theme_tag" >/dev/null 2>&1; then
            echo "Theme tag $theme_tag already exists; refusing to overwrite." >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          unzip -q "archive/${{ needs.verify.outputs.artifact-name }}" -d "$workdir"
          # 主题包根必须直接是 index.html + assets/，否则主题商店取不到文件。
          test -f "$workdir/index.html"
          test -d "$workdir/assets"

          # 主题商店把 theme-dist 的提交标题当作版本名显示在安装下拉里，
          # 所以这里不用 `chore: …` 这类对使用者没有意义的前缀。
          # 发布说明可选地写一行 `<!-- store-label: 简述 -->`（HTML 注释，渲染后不可见），
          # 写了就显示 `v1.2.3 · 简述`，没写就只显示 `v1.2.3`。
          # 必须在切到 theme-dist 之前读，那一步会清空源码树。
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          store_label=""
          if [[ -f "$notes_file" ]]; then
            store_label="$(grep -m1 -oP '(?<=<!-- store-label:).*?(?=-->)' "$notes_file" 2>/dev/null || true)"
            store_label="$(printf '%s' "$store_label" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          if [[ -n "$store_label" ]]; then
            commit_subject="${GITHUB_REF_NAME} · ${store_label}"
          else
            commit_subject="${GITHUB_REF_NAME}"
          fi
          echo "theme-dist commit subject: $commit_subject"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin theme-dist >/dev/null 2>&1; then
            git fetch --depth=1 origin theme-dist
            git checkout -B theme-dist FETCH_HEAD
          else
            git checkout --orphan theme-dist
          fi

          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r "$workdir"/. .
          git add -A
          git commit -m "$commit_subject"
          git tag "$theme_tag"
          git push origin "$theme_tag"

          # 预发布版本只发布不可变的 theme-<tag>，不推进 theme-dist——
          # 那条滚动分支代表「最新稳定版」，测试版不应改变它指向的内容。
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Pre-release $GITHUB_REF_NAME: leaving theme-dist untouched."
          else
            git push origin theme-dist
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, theme-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Download verified theme archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: .

      - name: Prepare stable release archive
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e "console.log(require('./package.json').version)")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          release_file="CFSM-Glassmorphism-${GITHUB_REF_NAME}.zip"
          mv "${{ needs.verify.outputs.artifact-name }}" "$release_file"
          echo "file=$release_file" >> "$GITHUB_OUTPUT"

          # 带连字符的语义化版本（例如 1.1.0-test.1）按预发布处理：
          # 标记为 pre-release，且不抢占 Latest。
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi
          echo "notes=$notes_file" >> "$GITHUB_OUTPUT"
          if [[ "$package_version" == *-* ]]; then
            echo "flags=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.release.outputs.file }}#CFSM Glassmorphism theme archive"
          --verify-tag
          ${{ steps.release.outputs.flags }}
          --title "CFSM Glassmorphism $GITHUB_REF_NAME"
          --notes-file "${{ steps.release.outputs.notes }}"
